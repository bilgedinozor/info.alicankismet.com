server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    # the web root is the repo itself: keep .git, .gitignore, .vscode etc. private
    location ~ /\. {
        return 404;
    }
    location ~ ^/(deploy/|docker-compose\.yml$|README\.md$) {
        return 404;
    }

    # big files that never change
    location ~* \.(jsdos|wasm|mp3|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # icons and pictures: small, but there are dozens of them on every visit.
    # replacing one under the same name can take a week to reach everybody
    location ~* \.(png|jpe?g|gif|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # file names are not fingerprinted, so everything else is revalidated on
    # every visit (a cheap 304) and a git pull shows up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
